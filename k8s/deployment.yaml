apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-agent
  labels:
    app: data-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: data-agent
  template:
    metadata:
      labels:
        app: data-agent
    spec:
      containers:
        - name: data-agent
          image: data-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATA_AGENT_PROFILE
              value: "prod"
            - name: DATA_AGENT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: data-agent-secrets
                  key: api-key
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: data-agent-secrets
                  key: deepseek-key
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: audit-data
              mountPath: /app/audit
            - name: session-data
              mountPath: /app/sessions
      volumes:
        - name: audit-data
          emptyDir: {}
        - name: session-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: data-agent
  labels:
    app: data-agent
spec:
  selector:
    app: data-agent
  ports:
    - port: 80
      targetPort: 8000
      name: http
  type: ClusterIP
---
apiVersion: v1
kind: Secret
metadata:
  name: data-agent-secrets
type: Opaque
stringData:
  api-key: "your-api-key-here"
  deepseek-key: "your-deepseek-key-here"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: data-agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: data-agent
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
